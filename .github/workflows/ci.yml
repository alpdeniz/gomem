name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Check
        run: make all
      - name: Race
        run: make test-race
      - name: Python bridge
        run: make python-smoke
